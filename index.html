<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSM Notebook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:light;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top, 0px);}
  body{margin:0;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  :root{
    --bg:#eef1ec;
    --surface:#ffffff;
    --surface-2:#f3f6f1;
    --ink:#20242b;
    --muted:#69716a;
    --line:#dbe1d5;
    --accent:#2b5f8f;
    --accent-ink:#ffffff;
    --accent-soft:#e1ebf4;
    --warn:#96590f;
    --warn-soft:#f6e9d6;
    --shadow:0 1px 2px rgba(25,25,20,.05), 0 10px 28px -14px rgba(25,25,20,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151a;
      --surface:#1a1e25;
      --surface-2:#1e232b;
      --ink:#e8e9ee;
      --muted:#9aa1ac;
      --line:#2c313b;
      --accent:#7cabe0;
      --accent-ink:#0c1620;
      --accent-soft:#1f2e40;
      --warn:#e2a862;
      --warn-soft:#392c19;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151a;
    --surface:#1a1e25;
    --surface-2:#1e232b;
    --ink:#e8e9ee;
    --muted:#9aa1ac;
    --line:#2c313b;
    --accent:#7cabe0;
    --accent-ink:#0c1620;
    --accent-soft:#1f2e40;
    --warn:#e2a862;
    --warn-soft:#392c19;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    margin:0;
    padding:0 16px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  .app{
    max-width:min(1720px, 96vw);
    margin:0 auto;
    display:grid;
    grid-template-columns: 322px 1fr;
    gap:28px;
    padding-block:28px 48px;
    align-items:start;
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr; padding-top:12px;}
  }

  /* ---------- Mobile topbar + drawer ---------- */
  .topbar{
    display:none;
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:50;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    margin:0 -16px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .topbar-btn{
    all:unset;
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:8px;
    color:var(--ink);
    cursor:pointer;
  }
  .topbar-btn:hover{background:var(--surface-2);}
  .topbar-btn span{display:block; width:18px; height:2px; background:currentColor; position:relative;}
  .topbar-btn span::before, .topbar-btn span::after{content:""; position:absolute; left:0; width:18px; height:2px; background:currentColor;}
  .topbar-btn span::before{top:-6px;}
  .topbar-btn span::after{top:6px;}
  .topbar-title{
    all:unset;
    cursor:pointer;
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:1.1rem;
    color:var(--ink);
  }
  .drawer-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(12,14,18,.42);
    z-index:45;
  }
  .drawer-overlay[hidden]{display:none;}

  @media (max-width:860px){
    .topbar{display:flex;}
    .drawer-overlay:not([hidden]){display:block;}
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:sticky;
    top:28px;
    display:flex;
    flex-direction:column;
    gap:20px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
    box-shadow:var(--shadow);
    max-height:calc(100vh - 56px);
  }
  @media (max-width:860px){
    .sidebar{
      position:fixed;
      top:0;
      left:0;
      bottom:0;
      width:min(86vw, 340px);
      max-height:none;
      border-radius:0;
      border-top:none;
      border-bottom:none;
      border-left:none;
      padding-top:calc(22px + env(safe-area-inset-top, 0px));
      padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));
      transform:translateX(-100%);
      transition:transform .22s ease;
      z-index:50;
      overflow-y:auto;
    }
    .sidebar.open{transform:translateX(0);}
    @media (prefers-reduced-motion: reduce){
      .sidebar{transition:none;}
    }
  }
  .brand-link{
    all:unset;
    display:block;
    width:100%;
    cursor:pointer;
    border-radius:8px;
  }
  .brand-link:hover .brand-title{color:var(--accent);}
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0;
  }
  .brand-title{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:1.7rem;
    margin:.1em 0 0;
    text-wrap:balance;
  }
  .brand-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:.74rem;
    color:var(--muted);
    margin:.35em 0 0;
  }

  .class-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .class-tab{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:.82rem;
    padding:.46em .85em;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
  }
  .class-tab:hover{border-color:var(--accent);}
  .class-tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:8px;
    padding:10px 12px;
  }
  .search-box svg{flex:none; color:var(--muted);}
  .search-box input{
    border:none;
    background:none;
    outline:none;
    width:100%;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.92rem;
    color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted);}

  .tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-height:118px;
    overflow-y:auto;
    padding-right:2px;
  }
  .tag-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.01em;
    padding:.4em .72em;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid transparent;
    cursor:pointer;
    line-height:1.2;
  }
  .tag-chip:hover{border-color:var(--accent);}
  .tag-chip.active{background:var(--accent); color:var(--accent-ink);}

  .lecture-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
    padding-right:2px;
  }
  .lecture-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:1px solid transparent;
    border-radius:8px;
    padding:11px 13px;
    cursor:pointer;
    color:var(--ink);
    font-family:inherit;
  }
  .lecture-item:hover{background:var(--surface-2); border-color:var(--line);}
  .lecture-item.active{background:var(--accent-soft); border-color:var(--accent);}
  .li-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:baseline;
  }
  .li-title{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:.98rem;
  }
  .li-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:.66rem;
    color:var(--accent);
    white-space:nowrap;
    flex:none;
  }
  .li-subject{
    color:var(--muted);
    font-size:.8rem;
    margin-top:3px;
    line-height:1.4;
  }
  .li-kind{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.6rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:6px;
  }
  .li-kind [data-kind="Resource"]{color:var(--accent); font-weight:600;}
  .li-class{
    color:var(--accent);
  }
  .li-class::after{
    content:"·";
    margin:0 .4em;
    color:var(--muted);
  }
  .list-group-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:20px 0 4px;
    padding:0 2px;
  }
  .list-group-head:first-child{margin-top:0;}
  .list-topic-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:.62rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    opacity:.8;
    margin:16px 0 4px 2px;
    padding:0 2px;
  }
  .list-topic-head:first-child{margin-top:0;}
  .empty-filter{
    color:var(--muted);
    font-size:.85rem;
    padding:10px 4px;
  }

  .sidebar-footer{
    display:flex;
    flex-direction:column;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:.66rem;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .footer-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .theme-toggle{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    padding:.4em .7em;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
  }
  .theme-toggle:hover{border-color:var(--accent); color:var(--accent);}
  .kbd-hints{display:flex; align-items:center; gap:.4em; flex-wrap:wrap;}
  kbd{
    font-family:'IBM Plex Mono', monospace;
    font-size:.62rem;
    padding:.15em .42em;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
  }
  @media (max-width:520px){
    .kbd-hints{display:none;}
  }

  /* ---------- Main content ---------- */
  .content{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    min-height:70vh;
    overflow:hidden;
  }
  .content-header{
    position:sticky;
    top:0;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:28px 40px 22px;
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(43,95,143,.05) 27px, rgba(43,95,143,.05) 28px);
  }
  .ch-kind{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0;
  }
  .ch-kind[data-kind="Resource"]{
    display:inline-block;
    padding:.2em .6em;
    border-radius:999px;
    background:var(--accent-soft);
  }
  .ch-title{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:2.05rem;
    margin:.16em 0 0;
    text-wrap:balance;
  }
  .ch-lede{
    color:var(--muted);
    font-size:1.02rem;
    margin:.4em 0 0;
    max-width:62ch;
  }
  .ch-meta{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    color:var(--muted);
  }
  .ch-meta .ch-date{color:var(--accent);}
  .ch-meta .ch-class{
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:.68rem;
  }
  .ch-meta .ch-class::after{content:"·"; margin-left:14px; color:var(--muted); font-weight:400; text-transform:none; display:inline-block;}
  .ch-meta .ch-topic{color:var(--ink);}
  .ch-meta .ch-topic::after{content:"·"; margin-left:14px; color:var(--muted); display:inline-block;}
  .ch-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.66rem;
    padding:.24em .58em;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
  }

  .content-body{
    padding:34px 40px 18px;
  }
  .content-body:not(.is-home){
    max-width:74ch;
    margin-inline:auto;
  }
  .content-body p{line-height:1.7; font-size:.98rem; margin:0 0 1.2em;}
  .content-body ul, .content-body ol{line-height:1.7; font-size:.98rem; padding-left:1.3em; margin:0 0 1.2em;}
  .content-body li{margin:.3em 0;}
  .lede{color:var(--muted); font-size:1.05rem; margin:0 0 1.4em;}
  .muted-note{color:var(--muted); font-size:.88rem; font-style:italic;}

  .review-src{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    color:var(--muted);
    margin:1.8em 0 .5em;
  }
  .review-src:first-of-type{margin-top:.4em;}
  .review-src a{color:var(--accent); text-decoration:none;}
  .review-src a:hover{text-decoration:underline;}

  h3.date-head{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:.07em;
    font-size:.78rem;
    color:var(--accent);
    margin:2.6em 0 .9em;
    padding-top:1.7em;
    border-top:1px dashed var(--line);
  }

  .eq{
    font-family:'IBM Plex Mono', monospace;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:1.05em 1.3em;
    margin:1.5em 0;
    overflow-x:auto;
    font-size:.95rem;
    line-height:1.9;
  }
  .eq-line{white-space:nowrap;}

  .frac{
    display:inline-flex;
    flex-direction:column;
    vertical-align:middle;
    text-align:center;
    margin:0 .2em;
    line-height:1.1;
    font-size:.94em;
  }
  .frac .num{padding:0 .2em .08em; border-bottom:1.3px solid currentColor;}
  .frac .den{padding:.08em .2em 0;}

  .det-wrap{
    display:inline-block;
    border-left:1.3px solid currentColor;
    border-right:1.3px solid currentColor;
    padding:0 .5em;
    vertical-align:middle;
    margin:0 .22em;
  }
  .det-wrap table{border-collapse:collapse;}
  .det-wrap td{padding:.08em .42em; text-align:center; font-variant-numeric:tabular-nums;}

  .mat-wrap{
    display:inline-flex;
    align-items:center;
    vertical-align:middle;
    margin:0 .22em;
  }
  .mat-wrap .bracket{
    font-size:1.7em;
    font-weight:300;
    line-height:1;
    transform:scaleY(1.3);
  }
  .mat-wrap table{border-collapse:collapse; margin:0 .1em;}
  .mat-wrap td{padding:.08em .4em; text-align:center; font-variant-numeric:tabular-nums;}
  .mat-wrap td.aug{border-left:1.3px solid currentColor;}

  .callout{
    border-left:3px solid var(--warn);
    background:var(--warn-soft);
    padding:.95em 1.25em;
    border-radius:0 8px 8px 0;
    font-size:.9rem;
    line-height:1.6;
    margin:1.5em 0;
  }
  .callout strong{color:var(--warn);}

  mark.hit{
    background:var(--accent);
    color:var(--accent-ink);
    border-radius:3px;
    padding:0 .1em;
  }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
    padding:8px 0 20px;
  }
  .empty-grid{
    width:100%;
    max-width:340px;
    height:150px;
    border:1.5px dashed var(--line);
    border-radius:10px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 17px, var(--line) 17px, var(--line) 18px),
      repeating-linear-gradient(90deg, transparent, transparent 17px, var(--line) 17px, var(--line) 18px);
    opacity:.6;
  }
  .empty-msg{font-size:1.02rem; margin:0; max-width:48ch;}
  .empty-sub{color:var(--muted); font-size:.9rem; margin:0; max-width:48ch;}

  .topic-nav{
    display:flex;
    justify-content:space-between;
    gap:12px;
    max-width:74ch;
    margin-inline:auto;
    padding:24px 40px 40px;
    margin-top:.8em;
    border-top:1px dashed var(--line);
  }
  .topic-nav[hidden]{display:none;}
  .nav-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.82rem;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:.55em .9em;
    cursor:pointer;
    max-width:48%;
    text-align:left;
    line-height:1.35;
  }
  .nav-btn:hover{border-color:var(--accent); color:var(--accent);}
  .nav-next{margin-left:auto; text-align:right;}

  /* ---------- Home dashboard ---------- */
  .home-view{max-width:none;}
  .home-hero{max-width:62ch; margin-bottom:28px;}
  .home-hero .ch-title{margin-top:.16em;}
  .class-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
  }
  .class-card{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
  }
  .cc-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .cc-head h3{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:1.22rem;
    margin:0;
  }
  .cc-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    color:var(--accent);
    flex:none;
  }
  .cc-kinds{color:var(--muted); font-size:.82rem; margin:0;}
  .cc-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .cc-flag{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color:var(--muted);
    margin:0;
  }
  .cc-flag-warn{color:var(--warn);}
  .cc-flag-resource{color:var(--accent);}
  .cc-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:auto;
    padding-top:6px;
  }
  .cc-open{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:.82rem;
    padding:.5em .9em;
    border-radius:7px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:var(--accent-ink);
    cursor:pointer;
  }
  .cc-open:hover{opacity:.9;}
  .cc-link{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.8rem;
    padding:.5em .85em;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
  }
  .cc-link:hover{border-color:var(--accent); color:var(--accent);}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>

<div class="topbar">
  <button type="button" class="topbar-btn" id="drawer-toggle" aria-label="Open menu" aria-expanded="false"><span></span></button>
  <button type="button" class="topbar-title" id="topbar-home">CSM Notebook</button>
</div>
<div class="drawer-overlay" id="drawer-overlay" hidden></div>

<div class="app">

  <aside class="sidebar">
    <button type="button" class="brand-link" id="brand-home" aria-label="Go to dashboard">
      <p class="brand-eyebrow">Notebook</p>
      <h1 class="brand-title">CSM Notebook</h1>
      <p class="brand-sub">College of San Mateo · transcribed from GoodNotes</p>
    </button>

        '<p><strong>Def:</strong> a linear equation in the variables x₁, …, xₙ has the form a₁x₁ + a₂x₂ + … + aₙxₙ = b, where a₁, …, aₙ and b are real numbers.</p>',

        '<p>As a matrix: T(x⃗) = ' + mat([["5","−3"],["−7","8"],["2","0"]]) + mat([["x₁"],["x₂"]]) + ' = Ax⃗. <strong>A is called the standard matrix.</strong></p>',
        '<div class="callout" style="border-left-color:var(--accent); background:var(--accent-soft);"><strong>Theorem:</strong> let T: ℝⁿ ⟶ ℝᵐ be a linear transformation. Then there exists a unique matrix A such that T(x⃗) = Ax⃗ for all x⃗ ∈ ℝⁿ.</div>',

        '<p><strong>Def — onto:</strong> a mapping T: ℝⁿ ⟶ ℝᵐ is <em>onto</em> if each b⃗ ∈ ℝᵐ is the image of at least one x⃗ ∈ ℝⁿ — equivalently, the range of T equals the codomain ℝᵐ. If T(x⃗) = Ax⃗, T is onto ℝᵐ ⟺ for every b⃗ ∈ ℝᵐ, Ax⃗ = b⃗ is consistent ⟺ every row [of the row-reduced A] has a pivot ⟺ the columns of A span ℝᵐ.</p>',

        gaps += scratch3.querySelectorAll('.muted-note').length;
      });
      var topics = (classTopics[cls] || []).filter(function(t){ return t !== "Study Tools" && t !== "Not Yet Transcribed"; });
      classSummary[cls] = { total: real.length, byKind: byKind, notYet: notYet, resources: resources, flagged: flagged, gaps: gaps, topics: topics };
    });
  })();

  function initialId(){
    var fromHash = decodeURIComponent((window.location.hash || "").replace(/^#/, ""));
    if (fromHash === "home") return "home";
    if (fromHash && notebooks.some(function(n){ return n.id === fromHash; })) return fromHash;
    return "home";
  }

  var state = { query: "", activeTags: [], activeClass: "All", currentId: initialId() };

  var listEl = document.getElementById('lecture-list');
  var tagRowEl = document.getElementById('tag-row');
  var classTabsEl = document.getElementById('class-tabs');
  var searchInput = document.getElementById('search-input');
  var footerEl = document.getElementById('sidebar-footer');
  var navEl = document.getElementById('topic-nav');
  var contentHeaderEl = document.querySelector('.content-header');
  var sidebarEl = document.querySelector('.sidebar');
  var drawerOverlayEl = document.getElementById('drawer-overlay');
  var drawerToggleEl = document.getElementById('drawer-toggle');

  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function openDrawer(){
    sidebarEl.classList.add('open');
    drawerOverlayEl.hidden = false;
    drawerToggleEl.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer(){
    sidebarEl.classList.remove('open');
    drawerOverlayEl.hidden = true;
    drawerToggleEl.setAttribute('aria-expanded', 'false');
  }
  drawerToggleEl.addEventListener('click', function(){
    sidebarEl.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  drawerOverlayEl.addEventListener('click', closeDrawer);

  function inActiveClass(n){
    return state.activeClass === "All" || n.class === state.activeClass;
  }

  function matches(n){
    if (!inActiveClass(n)) return false;
    if (state.query && n.search.indexOf(state.query) === -1) return false;
    for (var i=0;i<state.activeTags.length;i++){
      if (n.tags.indexOf(state.activeTags[i]) === -1) return false;
    }
    return true;
  }

  function tagsForActiveClass(){
    var tags = [];
    notebooks.forEach(function(n){
      if (!inActiveClass(n)) return;
      n.tags.forEach(function(t){ if (tags.indexOf(t) === -1) tags.push(t); });
    });
    return tags;
  }

  function renderClassTabs(){
    classTabsEl.innerHTML = "";
    var all = ["All"].concat(classes);
    all.forEach(function(c){
      var tab = document.createElement('button');
      tab.type = "button";
      tab.className = "class-tab" + (state.activeClass === c ? " active" : "");
      tab.textContent = c === "All" ? "All Classes" : c;
      tab.addEventListener('click', function(){
        if (state.activeClass === c) return;
        state.activeClass = c;
        state.activeTags = state.activeTags.filter(function(t){ return tagsForActiveClass().indexOf(t) > -1; });
        refresh();
      });
      classTabsEl.appendChild(tab);
    });
  }

  function renderTags(){
    tagRowEl.innerHTML = "";
    tagsForActiveClass().forEach(function(t){
      var chip = document.createElement('button');
      chip.type = "button";
      chip.className = "tag-chip" + (state.activeTags.indexOf(t) > -1 ? " active" : "");
      chip.textContent = t;
      chip.addEventListener('click', function(){
        var idx = state.activeTags.indexOf(t);
        if (idx > -1) state.activeTags.splice(idx,1); else state.activeTags.push(t);
        refresh();
      });
      tagRowEl.appendChild(chip);
    });
  }

  function makeListItem(n){
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.type = "button";
    btn.className = "lecture-item" + (n.id === state.currentId ? " active" : "");
    var classBadge = state.activeClass === "All" ? '<span class="li-class">'+n.class+'</span>' : '';
    btn.innerHTML =
      '<div class="li-top"><span class="li-title">'+n.title+'</span><span class="li-date">'+n.date+'</span></div>'+
      '<div class="li-subject">'+n.subject+'</div>'+
      '<div class="li-kind">'+classBadge+'<span data-kind="'+n.kind+'">'+(n.kind === "Resource" ? "↗ " : "")+n.kind+'</span></div>';
    btn.addEventListener('click', function(){ goTo(n.id); });
    li.appendChild(btn);
    return li;
  }

  function renderTopicGroups(list, cls){
    (classTopics[cls] || []).forEach(function(t){
      var inTopic = list.filter(function(n){ return n.topic === t; });
      if (inTopic.length === 0) return;
      var head = document.createElement('li');
      head.className = "list-topic-head";
      head.textContent = t;
      listEl.appendChild(head);
      inTopic.forEach(function(n){ listEl.appendChild(makeListItem(n)); });
    });
  }

  function renderList(){
    listEl.innerHTML = "";
    var visible = notebooks.filter(matches);
    if (visible.length === 0){
      var li = document.createElement('li');
      li.className = "empty-filter";
      li.textContent = "No notebooks match that search.";
      listEl.appendChild(li);
      return;
    }
    if (state.currentId !== "home" && visible.indexOf(notebooks.find(function(n){return n.id===state.currentId;})) === -1){
      state.currentId = visible[0].id;
    }
    if (state.activeClass === "All"){
      classes.forEach(function(c){
        var inClass = visible.filter(function(n){ return n.class === c; });
        if (inClass.length === 0) return;
        var head = document.createElement('li');
        head.className = "list-group-head";
        head.textContent = c;
        listEl.appendChild(head);
        renderTopicGroups(inClass, c);
      });
    } else {
      renderTopicGroups(visible, state.activeClass);
    }
  }

  function highlight(container, query){
    if (!query) return;
    var re = new RegExp('('+escRe(query)+')', 'ig');
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    var node;
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(function(n){
      if (!re.test(n.nodeValue)) return;
      re.lastIndex = 0;
      var frag = document.createDocumentFragment();
      var parts = n.nodeValue.split(re);
      parts.forEach(function(part, i){
        if (i % 2 === 1){
          var mark = document.createElement('mark');
          mark.className = 'hit';
          mark.textContent = part;
          frag.appendChild(mark);
        } else if (part) {
          frag.appendChild(document.createTextNode(part));
        }
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function renderTopicNav(n){
    var siblings = notebooks.filter(function(x){ return x.class === n.class && x.topic === n.topic; });
    var idx = siblings.indexOf(n);
    var prev = idx > 0 ? siblings[idx-1] : null;
    var next = idx < siblings.length-1 ? siblings[idx+1] : null;
    if (!prev && !next){ navEl.hidden = true; navEl.innerHTML = ""; return; }
    navEl.hidden = false;
    navEl.innerHTML =
      (prev ? '<button type="button" class="nav-btn nav-prev" data-id="'+prev.id+'">← '+prev.title+'</button>' : '<span></span>') +
      (next ? '<button type="button" class="nav-btn nav-next" data-id="'+next.id+'">'+next.title+' →</button>' : '<span></span>');
    Array.prototype.forEach.call(navEl.querySelectorAll('.nav-btn'), function(btn){
      btn.addEventListener('click', function(){ goTo(btn.getAttribute('data-id')); });
    });
  }

  function renderHomeCard(cls){
    var s = classSummary[cls];
    var kindParts = Object.keys(s.byKind).map(function(k){
      return s.byKind[k] + ' ' + (s.byKind[k] === 1 ? k : k + 's');
    }).join(' · ');
    var topicChips = s.topics.slice(0, 5).map(function(t){ return '<span class="tag">'+t+'</span>'; }).join('');
    var flags = '';
    if (s.notYet) flags += '<p class="cc-flag cc-flag-warn">' + s.notYet + ' not yet transcribed</p>';
    if (s.flagged || s.gaps) flags += '<p class="cc-flag">' + s.flagged + ' flagged for double-checking · ' + s.gaps + ' unfinished page' + (s.gaps === 1 ? '' : 's') + '</p>';
    if (s.resources) flags += '<p class="cc-flag cc-flag-resource">↗ ' + s.resources + ' outside resource' + (s.resources === 1 ? '' : 's') + '</p>';
    return '' +
      '<article class="class-card">' +
        '<div class="cc-head"><h3>'+cls+'</h3><span class="cc-count">'+s.total+'</span></div>' +
        '<p class="cc-kinds">'+kindParts+'</p>' +
        '<div class="cc-tags">'+topicChips+'</div>' +
        flags +
        '<div class="cc-actions">' +
          '<button type="button" class="cc-open" data-open="'+cls+'">Open →</button>' +
          '<button type="button" class="cc-link" data-goto="cheatsheet-'+clsSlug(cls)+'">Cheat sheet</button>' +
          '<button type="button" class="cc-link" data-goto="review-'+clsSlug(cls)+'">Needs review</button>' +
        '</div>' +
      '</article>';
  }

  function renderHome(){
    contentHeaderEl.hidden = true;
    navEl.hidden = true;
    navEl.innerHTML = "";
    var totalReal = notebooks.filter(isTranscribed).length;
    var totalFlagged = 0, totalNotYet = 0, totalResources = 0;
    classes.forEach(function(c){ totalFlagged += classSummary[c].flagged; totalNotYet += classSummary[c].notYet; totalResources += classSummary[c].resources; });
    var lede = totalReal + " notebooks across " + classes.length + " classes";
    if (totalResources) lede += " · " + totalResources + " outside resource" + (totalResources === 1 ? "" : "s");
    if (totalFlagged) lede += " · " + totalFlagged + " flagged for double-checking";
    if (totalNotYet) lede += " · " + totalNotYet + " not yet transcribed";
    var body = document.getElementById('content-body');
    body.classList.add('is-home');
    body.innerHTML =
      '<div class="home-view">' +
        '<div class="home-hero">' +
          '<p class="ch-kind">Dashboard</p>' +
          '<h2 class="ch-title">All Classes, One Place</h2>' +
          '<p class="ch-lede">'+lede+'.</p>' +
        '</div>' +
        '<div class="class-grid">' + classes.map(renderHomeCard).join('') + '</div>' +
      '</div>';
    Array.prototype.forEach.call(body.querySelectorAll('[data-open]'), function(btn){
      btn.addEventListener('click', function(){
        state.activeClass = btn.getAttribute('data-open');
        var first = notebooks.find(function(n){ return n.class === state.activeClass && isTranscribed(n); });
        goTo(first ? first.id : "home");
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-goto]'), function(btn){
      btn.addEventListener('click', function(){ goTo(btn.getAttribute('data-goto')); });
    });
  }

  function renderContent(){
    if (state.currentId === "home"){ renderHome(); return; }
    contentHeaderEl.hidden = false;
    var n = notebooks.find(function(x){ return x.id === state.currentId; });
    if (!n) return;
    var chKindEl = document.getElementById('ch-kind');
    chKindEl.textContent = (n.kind === "Resource" ? "↗ " : "") + n.kind;
    chKindEl.setAttribute('data-kind', n.kind);
    document.getElementById('ch-title').textContent = n.title;
    document.getElementById('ch-class').textContent = n.class;
    document.getElementById('ch-topic').textContent = n.topic;
    document.getElementById('ch-date').textContent = n.date;
    document.getElementById('ch-source').textContent = "Source: " + n.source;
    document.getElementById('ch-tags').innerHTML = n.tags.map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");
    var body = document.getElementById('content-body');
    body.classList.remove('is-home');
    body.innerHTML = n.html;
    if (state.query) highlight(body, state.query);
    renderTopicNav(n);
  }

  function refresh(){
    renderClassTabs();
    renderTags();
    renderList();
    renderContent();
  }

  function selectId(id){
    state.currentId = id;
    refresh();
    closeDrawer();
    document.querySelector('.content').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function goTo(id){
    if (window.location.hash.replace(/^#/, "") === id){ selectId(id); return; }
    window.location.hash = id;
  }

  function goHome(){
    state.activeClass = "All";
    state.activeTags = [];
    state.query = "";
    searchInput.value = "";
    goTo("home");
  }

  window.addEventListener('hashchange', function(){
    var id = decodeURIComponent(window.location.hash.replace(/^#/, ""));
    if (id === "" || id === "home"){ selectId("home"); return; }
    if (notebooks.some(function(n){ return n.id === id; })) selectId(id);
  });

  searchInput.addEventListener('input', function(){
    state.query = searchInput.value.trim().toLowerCase();
    refresh();
  });

  document.getElementById('brand-home').addEventListener('click', goHome);
  document.getElementById('topbar-home').addEventListener('click', goHome);

  // ---- keyboard shortcuts: / to search, j/k to browse the visible list, Esc to back out ----
  document.addEventListener('keydown', function(e){
    var tag = (e.target && e.target.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);

    if (e.key === "/" && !typing){
      e.preventDefault();
      if (window.innerWidth <= 860) openDrawer();
      searchInput.focus();
      return;
    }
    if (e.key === "Escape"){
      if (document.activeElement === searchInput && state.query){
        searchInput.value = "";
        state.query = "";
        refresh();
        searchInput.blur();
        return;
      }
      if (sidebarEl.classList.contains('open')){ closeDrawer(); return; }
      return;
    }
    if (typing) return;
    if (e.key === "j" || e.key === "k"){
      var items = notebooks.filter(matches);
      if (!items.length) return;
      var idx = items.findIndex(function(n){ return n.id === state.currentId; });
      if (e.key === "j") idx = idx < items.length - 1 ? idx + 1 : items.length - 1;
      else idx = idx > 0 ? idx - 1 : 0;
      e.preventDefault();
      goTo(items[idx].id);
    }
  });

  // ---- theme toggle button + keyboard hints, built into the sidebar footer ----
  var THEME_MODES = ["auto", "light", "dark"];
  var THEME_LABELS = { auto: "Auto", light: "Light", dark: "Dark" };
  var THEME_ICONS = { auto: "◐", light: "☀", dark: "☾" };
  var realCount = notebooks.filter(isTranscribed).length;
  var resourceCount = notebooks.filter(function(n){ return n.kind === "Resource"; }).length;
  footerEl.innerHTML =
    '<div class="footer-stats">' + realCount + ' notebooks across ' + classes.length + ' classes' + (resourceCount ? ' · ' + resourceCount + ' outside resources' : '') + ' · updated Sep 16, 2026</div>' +
    '<div class="footer-controls">' +
      '<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Theme: ' + THEME_LABELS[themeMode] + '. Click to change.">' + THEME_ICONS[themeMode] + ' ' + THEME_LABELS[themeMode] + '</button>' +
      '<span class="kbd-hints"><kbd>/</kbd> search <kbd>j</kbd><kbd>k</kbd> browse</span>' +
    '</div>';
  var themeBtn = document.getElementById('theme-toggle');
  themeBtn.addEventListener('click', function(){
    var idx = THEME_MODES.indexOf(themeMode);
    themeMode = THEME_MODES[(idx + 1) % THEME_MODES.length];
    applyTheme(themeMode);
    try{ localStorage.setItem(THEME_KEY, themeMode); } catch(e){}
    themeBtn.innerHTML = THEME_ICONS[themeMode] + ' ' + THEME_LABELS[themeMode];
    themeBtn.setAttribute('aria-label', 'Theme: ' + THEME_LABELS[themeMode] + '. Click to change.');
  });

  refresh();

})();
</script>

</body>
